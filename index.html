<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bio-Waste Drop-Off (Customer)</title>
  <link rel="stylesheet" href="styles.css">
  <script src="core.js"></script>
</head>
<body>

  <nav>
    <h2>🌱 Customer Portal</h2>
    <a href="admin.html">Switch to Admin View →</a>
  </nav>

  <div class="card">
    <h3>Submit Bio-Waste Drop-Off</h3>
    <input type="text" id="customerName" placeholder="Your Name (e.g., Alex)" required>
    <input type="text" id="wasteNote" placeholder="Waste details (e.g., 2kg vegetable scraps)" required>
    <input type="file" id="wastePhoto" accept="image/*" required>
    <button onclick="submitWaste()">Upload Drop-Off</button>
  </div>

  <div class="card">
    <h3>Your Submissions & Grades</h3>
    <div id="submissionsList"></div>
  </div>
</body>
</html>
